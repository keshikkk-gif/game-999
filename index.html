<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0612">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}[hidden]{display:none!important}</style>
<title>999 В РЯД</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Ruslan+Display&display=swap">
<style>
  /* Layout: one-screen app. Header (title + score), square board that fills the free height, Baba Yaga's line, three buttons. Single dark look by design. */
  :root {
    --bg: #0a0612;
    --panel: #150b24;
    --line: #3a2459;
    --gold: #e8b84a;
    --gold-deep: #9c6f1c;
    --ink: #f1e8ff;
    --muted: #a899c4;
    --font-display: 'Ruslan Display', Georgia, 'Times New Roman', serif;
    --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    box-sizing: border-box;
    background: var(--bg);
    background-image: radial-gradient(120% 70% at 50% -10%, #2a1450 0%, rgba(10, 6, 18, 0) 60%);
    color: var(--ink);
    font-family: var(--font-body);
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  .app {
    height: 100%;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .brand { min-width: 0; }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(26px, 8vw, 36px);
    line-height: 1;
    color: var(--gold);
    letter-spacing: 0.02em;
    text-shadow: 0 2px 0 #3b2606, 0 0 18px rgba(232, 184, 74, 0.25);
    white-space: nowrap;
  }
  .sub { margin: 5px 0 0; font-size: 10px; font-weight: 700; letter-spacing: 0.22em; color: var(--muted); white-space: nowrap; }
  .stats { display: flex; gap: 14px; }
  .stat { display: flex; flex-direction: column; align-items: flex-end; }
  .k { font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; }
  #score { color: var(--ink); }
  #best { color: var(--gold); }
  .stage { flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; }
  canvas { display: block; touch-action: none; border-radius: 16px; }
  .say {
    margin: 0;
    min-height: 3.1em;
    padding: 9px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.4;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .who { font-size: 10px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
  .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  button {
    min-height: 46px;
    font: 700 14px var(--font-body);
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
  }
  button:active { transform: translateY(1px); background: #1d1033; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button.primary { color: #2a1a02; background: linear-gradient(180deg, #f3cd6c, #cf9a2e); border-color: var(--gold-deep); }
  button.primary:active { background: linear-gradient(180deg, #e0b85a, #b98724); }
  button:disabled { opacity: 0.45; }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>999 В РЯД</h1>
      <p class="sub">VIBE YAGI × ZiFRETTA</p>
    </div>
    <div class="stats">
      <div class="stat"><span class="k">Очки</span><span class="v" id="score">0</span></div>
      <div class="stat"><span class="k">Рекорд</span><span class="v" id="best">0</span></div>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="board" role="img" aria-label="Игровое поле 8 на 8 с кристаллами"></canvas>
  </main>

  <p class="say" aria-live="polite"><span class="who">Баба Яга</span><span id="say"></span></p>

  <nav class="btns">
    <button id="btnHint" type="button">Подсказка</button>
    <button id="btnShuffle" type="button">Перемешать</button>
    <button id="btnNew" type="button" class="primary">Новая игра</button>
  </nav>
</div>

<script>
// =====================================================================
// ==== ENGINE: чистая логика игры, без рисования. Её проверяют тесты. ====
// =====================================================================
const ROWS = 8, COLS = 8, TYPES = 5;

function randType(rng) { return Math.floor(rng() * TYPES); }
function cloneGrid(g) { return g.map(r => r.slice()); }

// Находит все совпадения: горизонтальные и вертикальные ряды из 3 и более.
// Возвращает уникальные клетки и список рядов (для начисления очков).
function findMatches(g) {
  const mark = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
  const runs = [];
  for (let r = 0; r < ROWS; r++) {
    let c = 0;
    while (c < COLS) {
      const t = g[r][c];
      if (t < 0) { c++; continue; }
      let e = c;
      while (e + 1 < COLS && g[r][e + 1] === t) e++;
      const len = e - c + 1;
      if (len >= 3) { runs.push({ len, dir: 'h' }); for (let k = c; k <= e; k++) mark[r][k] = true; }
      c = e + 1;
    }
  }
  for (let c = 0; c < COLS; c++) {
    let r = 0;
    while (r < ROWS) {
      const t = g[r][c];
      if (t < 0) { r++; continue; }
      let e = r;
      while (e + 1 < ROWS && g[e + 1][c] === t) e++;
      const len = e - r + 1;
      if (len >= 3) { runs.push({ len, dir: 'v' }); for (let k = r; k <= e; k++) mark[k][c] = true; }
      r = e + 1;
    }
  }
  const cells = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (mark[r][c]) cells.push([r, c]);
  return { cells, runs };
}

// Ищет любой ход, после которого появится совпадение. Поле в покое не содержит готовых совпадений.
function findMove(g) {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      for (const [dr, dc] of [[0, 1], [1, 0]]) {
        const r2 = r + dr, c2 = c + dc;
        if (r2 >= ROWS || c2 >= COLS) continue;
        if (g[r][c] === g[r2][c2]) continue;
        const a = g[r][c]; g[r][c] = g[r2][c2]; g[r2][c2] = a;
        const ok = findMatches(g).cells.length > 0;
        g[r2][c2] = g[r][c]; g[r][c] = a;
        if (ok) return [[r, c], [r2, c2]];
      }
    }
  }
  return null;
}

// Новое поле: без готовых совпадений и минимум с одним возможным ходом.
function makeGrid(rng) {
  for (let attempt = 0; attempt < 500; attempt++) {
    const g = Array.from({ length: ROWS }, () => Array(COLS).fill(-1));
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        let t;
        do { t = randType(rng); } while (
          (c >= 2 && g[r][c - 1] === t && g[r][c - 2] === t) ||
          (r >= 2 && g[r - 1][c] === t && g[r - 2][c] === t)
        );
        g[r][c] = t;
      }
    }
    if (findMove(g)) return g;
  }
  throw new Error('Не удалось создать поле');
}

// Перемешивание, когда ходов не осталось: те же кристаллы, новый порядок.
function shuffleGrid(g, rng) {
  const flat = g.flat();
  for (let attempt = 0; attempt < 200; attempt++) {
    for (let i = flat.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const tmp = flat[i]; flat[i] = flat[j]; flat[j] = tmp;
    }
    const n = [];
    for (let r = 0; r < ROWS; r++) n.push(flat.slice(r * COLS, (r + 1) * COLS));
    if (findMatches(n).cells.length === 0 && findMove(n)) return n;
  }
  return makeGrid(rng);
}

// Очки: 10 за кристалл, бонус за 4 (+20) и 5+ (+50) в ряд, умножение на номер цепной реакции.
function scoreFor(res, level) {
  let pts = res.cells.length * 10;
  for (const run of res.runs) {
    if (run.len === 4) pts += 20;
    else if (run.len >= 5) pts += 50;
  }
  return pts * level;
}

// Падение: кристаллы оседают вниз, сверху появляются новые.
// Меняет поле и возвращает описание движений для анимации.
function gravity(g, rng) {
  const moves = [], spawns = [];
  for (let c = 0; c < COLS; c++) {
    let w = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (g[r][c] >= 0) {
        if (r !== w) { g[w][c] = g[r][c]; g[r][c] = -1; moves.push({ c, from: r, to: w }); }
        w--;
      }
    }
    const n = w + 1;
    for (let r = w; r >= 0; r--) {
      const t = randType(rng);
      g[r][c] = t;
      spawns.push({ c, to: r, from: r - n, type: t });
    }
  }
  return { moves, spawns };
}
// ==== /ENGINE ====

// =====================================================================
// ==== ИГРА: рисование, ввод, анимации ====
// =====================================================================
const $ = s => document.querySelector(s);
const canvas = $('#board'), ctx = canvas.getContext('2d');

// Пять кристаллов. У каждого свой цвет и своя форма, чтобы различать без цвета.
const hexPts = Array.from({ length: 6 }, (_, i) => { const a = (-90 + 60 * i) * Math.PI / 180; return [Math.cos(a) * 0.95, Math.sin(a) * 0.95]; });
const pentPts = Array.from({ length: 5 }, (_, i) => { const a = (-90 + 72 * i) * Math.PI / 180; return [Math.cos(a), Math.sin(a)]; });
const GEMS = [
  { name: 'Рубин',   pts: [[0, -1], [0.88, 0], [0, 1], [-0.88, 0]], c: ['#ff9bb0', '#e0194f', '#6a0a2a'] },
  { name: 'Сапфир',  pts: hexPts, c: ['#9bd2ff', '#2f7fe6', '#10357d'] },
  { name: 'Изумруд', pts: [[-0.55, -0.92], [0.55, -0.92], [0.92, -0.55], [0.92, 0.55], [0.55, 0.92], [-0.55, 0.92], [-0.92, 0.55], [-0.92, -0.55]], c: ['#8bffc3', '#17b865', '#06512f'] },
  { name: 'Топаз',   circle: true, c: ['#fff3b0', '#f2b822', '#8d5b00'] },
  { name: 'Аметист', pts: pentPts, c: ['#ecc4ff', '#a04ae8', '#471680'] },
];

let grid = null, tiles = null;
let score = 0, best = 0, bestBase = 0, shownScore = -1, shownBest = -1;
let busy = false, selected = null, hint = null, drag = null;
let size = 0, cell = 0, ox = 0, dpr = 1;
const dying = [], tweens = [], particles = [], popups = [];
const scoreView = { v: 0 };
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPEED = reduce ? 0.4 : 1;

try { best = +localStorage.getItem('999best') || 0; } catch (e) { best = 0; }
bestBase = best;

// ---------- анимации ----------
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeInBack = t => 2.70158 * t * t * t - 1.70158 * t * t;

function tween(obj, to, ms, ease) {
  ease = ease || easeOutCubic;
  return new Promise(resolve => {
    const from = {};
    for (const k in to) from[k] = obj[k];
    tweens.push({ obj, from, to, ms: ms * SPEED, t0: performance.now(), ease, resolve });
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms * SPEED));

function burst(x, y, typeIdx) {
  const col = GEMS[typeIdx].c[0];
  const n = reduce ? 3 : 7;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (0.6 + Math.random() * 1.6) * cell * 0.02;
    particles.push({ x, y, vx: Math.cos(a) * sp * 60, vy: Math.sin(a) * sp * 60 - cell * 0.4, life: 520 + Math.random() * 240, t0: performance.now(), color: i % 3 === 0 ? '#ffe9a6' : col, r: cell * (0.04 + Math.random() * 0.04) });
  }
}
function popup(x, y, text, px) {
  popups.push({ x, y, text, px, t0: performance.now(), life: 950 });
}

// ---------- размеры ----------
function fit() {
  const st = $('#stage');
  const w = st.clientWidth, h = st.clientHeight;
  size = Math.floor(Math.max(120, Math.min(w, h)));
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  canvas.width = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);
  ox = size * 0.018;
  cell = (size - 2 * ox) / COLS;
}
const cx = c => ox + (c + 0.5) * cell;
const cy = r => ox + (r + 0.5) * cell;

// ---------- рисование ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function gemPath(g, r) {
  ctx.beginPath();
  if (g.circle) { ctx.arc(0, 0, r * 0.95, 0, Math.PI * 2); return; }
  g.pts.forEach(([x, y], i) => i ? ctx.lineTo(x * r, y * r) : ctx.moveTo(x * r, y * r));
  ctx.closePath();
}
function drawGem(t, x, y, extra) {
  const g = GEMS[t.type];
  const r = cell * 0.4;
  const s = Math.max(0, t.s) * (extra || 1);
  if (s <= 0) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.globalAlpha = Math.max(0, Math.min(1, t.a));
  gemPath(g, r);
  const gr = ctx.createLinearGradient(-r, -r, r, r);
  gr.addColorStop(0, g.c[0]); gr.addColorStop(0.5, g.c[1]); gr.addColorStop(1, g.c[2]);
  ctx.fillStyle = gr; ctx.fill();
  ctx.lineWidth = Math.max(1.5, r * 0.09);
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.stroke();
  gemPath(g, r * 0.55);
  ctx.fillStyle = 'rgba(255,255,255,0.16)'; ctx.fill();
  ctx.beginPath();
  ctx.ellipse(-r * 0.3, -r * 0.36, r * 0.22, r * 0.12, -0.6, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fill();
  ctx.restore();
}
function ring(r, c, alpha, width) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.lineWidth = width;
  ctx.strokeStyle = '#e8b84a';
  rr(ox + c * cell + 2, ox + r * cell + 2, cell - 4, cell - 4, cell * 0.16);
  ctx.stroke();
  ctx.restore();
}
function draw(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size, size);
  // рамка поля
  const bg = ctx.createLinearGradient(0, 0, 0, size);
  bg.addColorStop(0, '#1d1032'); bg.addColorStop(1, '#0c0616');
  rr(1, 1, size - 2, size - 2, size * 0.04);
  ctx.fillStyle = bg; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(232,184,74,0.4)'; ctx.stroke();

  ctx.save();
  rr(ox, ox, cell * COLS, cell * ROWS, size * 0.02);
  ctx.clip();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      ctx.fillStyle = (r + c) % 2 ? 'rgba(255,255,255,0.035)' : 'rgba(255,255,255,0.075)';
      ctx.fillRect(ox + c * cell, ox + r * cell, cell, cell);
    }
  }
  if (tiles) {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = tiles[r][c];
        if (!t) continue;
        const isSel = selected && selected.r === r && selected.c === c;
        drawGem(t, cx(t.x), cy(t.y), isSel ? 1.1 + 0.04 * Math.sin(now / 140) : 1);
      }
    }
    for (const t of dying) drawGem(t, cx(t.x), cy(t.y));
  }
  ctx.restore();

  if (selected) ring(selected.r, selected.c, 0.75 + 0.25 * Math.sin(now / 160), 3);
  if (hint && now < hint.until) {
    const a = 0.5 + 0.5 * Math.sin(now / 130);
    for (const [r, c] of hint.cells) ring(r, c, a, 3);
  }

  for (const p of particles) {
    const k = (now - p.t0) / p.life;
    if (k >= 1) continue;
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 - k * 0.5), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const p of popups) {
    const k = (now - p.t0) / p.life;
    if (k >= 1) continue;
    ctx.save();
    ctx.globalAlpha = 1 - k * k;
    ctx.font = '800 ' + p.px + 'px Manrope, system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const y = p.y - cell * 0.9 * easeOutCubic(k);
    ctx.lineWidth = Math.max(3, p.px * 0.18); ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(15,6,28,0.9)'; ctx.strokeText(p.text, p.x, y);
    ctx.fillStyle = '#ffd877'; ctx.fillText(p.text, p.x, y);
    ctx.restore();
  }
}

let last = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const w = tweens[i];
    const p = w.ms <= 0 ? 1 : Math.min(1, (now - w.t0) / w.ms);
    const e = w.ease(p);
    for (const k in w.to) w.obj[k] = w.from[k] + (w.to[k] - w.from[k]) * e;
    if (p >= 1) { for (const k in w.to) w.obj[k] = w.to[k]; tweens.splice(i, 1); w.resolve(); }
  }
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += cell * 5 * dt; }
  for (let i = particles.length - 1; i >= 0; i--) if (now - particles[i].t0 > particles[i].life) particles.splice(i, 1);
  for (let i = popups.length - 1; i >= 0; i--) if (now - popups[i].t0 > popups[i].life) popups.splice(i, 1);

  const sv = Math.round(scoreView.v);
  if (sv !== shownScore) { shownScore = sv; $('#score').textContent = sv.toLocaleString('ru-RU'); }
  const bv = Math.max(bestBase, sv);
  if (bv !== shownBest) { shownBest = bv; $('#best').textContent = bv.toLocaleString('ru-RU'); }

  draw(now);
  requestAnimationFrame(frame);
}

// ---------- игровой процесс ----------
function say(text) { $('#say').textContent = text; }
function adjacent(a, b) { return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1; }
function inBounds(p) { return p.r >= 0 && p.c >= 0 && p.r < ROWS && p.c < COLS; }

function buildTiles(g, s, a) {
  return g.map((row, r) => row.map((t, c) => ({ type: t, x: c, y: r, s, a })));
}
function swapCells(a, b) {
  const t = grid[a.r][a.c]; grid[a.r][a.c] = grid[b.r][b.c]; grid[b.r][b.c] = t;
  const u = tiles[a.r][a.c]; tiles[a.r][a.c] = tiles[b.r][b.c]; tiles[b.r][b.c] = u;
}

function addScore(n) {
  score += n;
  tween(scoreView, { v: score }, 500);
  if (score > best) {
    best = score;
    try { localStorage.setItem('999best', String(best)); } catch (e) { /* без сохранения рекорда */ }
  }
}

async function clearCells(cells) {
  const jobs = [];
  for (const [r, c] of cells) {
    const t = tiles[r][c];
    burst(cx(c), cy(r), t.type);
    dying.push(t);
    tiles[r][c] = null;
    grid[r][c] = -1;
    jobs.push(tween(t, { s: 0, a: 0 }, 260, easeInBack).then(() => {
      const i = dying.indexOf(t); if (i >= 0) dying.splice(i, 1);
    }));
  }
  await Promise.all(jobs);
}

async function dropTiles(moves, spawns) {
  const jobs = [];
  for (const m of moves) {
    const t = tiles[m.from][m.c];
    tiles[m.to][m.c] = t;
    tiles[m.from][m.c] = null;
    jobs.push(tween(t, { y: m.to }, 110 + 60 * (m.to - m.from)));
  }
  for (const s of spawns) {
    const t = { type: s.type, x: s.c, y: s.from, s: 1, a: 1 };
    tiles[s.to][s.c] = t;
    jobs.push(tween(t, { y: s.to }, 110 + 60 * (s.to - s.from)));
  }
  await Promise.all(jobs);
}

async function resolveBoard() {
  let level = 1, total = 0, longRun = false;
  for (;;) {
    const res = findMatches(grid);
    if (!res.cells.length) break;
    const pts = scoreFor(res, level);
    total += pts;
    if (res.runs.some(r => r.len >= 4)) longRun = true;
    addScore(pts);
    let sx = 0, sy = 0;
    for (const [r, c] of res.cells) { sx += cx(c); sy += cy(r); }
    popup(sx / res.cells.length, sy / res.cells.length, '+' + pts, Math.round(cell * 0.5));
    if (level >= 2) popup(size / 2, size * 0.42, 'Цепь ×' + level, Math.round(cell * 0.72));
    await clearCells(res.cells);
    const { moves, spawns } = gravity(grid, Math.random);
    await dropTiles(moves, spawns);
    level++;
  }
  const chain = level - 1;
  let msg = '+' + total.toLocaleString('ru-RU') + ' очков';
  if (chain > 1) msg += '. Цепная реакция ×' + chain + '!';
  else if (longRun) msg += '. Длинный ряд даёт бонус.';
  say(msg);
}

async function reshuffle(announce) {
  say(announce ? 'Ходов не осталось. Яга перемешала поле.' : 'Перемешала.');
  popup(size / 2, size / 2, 'Перемешивание', Math.round(cell * 0.6));
  const all = tiles.flat().filter(Boolean);
  await Promise.all(all.map(t => tween(t, { s: 0, a: 0 }, 260, easeInOut)));
  grid = shuffleGrid(grid, Math.random);
  tiles = buildTiles(grid, 0, 0);
  await Promise.all(tiles.flat().map(t => tween(t, { s: 1, a: 1 }, 300)));
}

async function attemptSwap(a, b) {
  if (busy || !grid || !inBounds(a) || !inBounds(b) || !adjacent(a, b)) return;
  busy = true; selected = null; hint = null;
  const ta = tiles[a.r][a.c], tb = tiles[b.r][b.c];
  await Promise.all([tween(ta, { x: b.c, y: b.r }, 150, easeInOut), tween(tb, { x: a.c, y: a.r }, 150, easeInOut)]);
  swapCells(a, b);
  if (findMatches(grid).cells.length === 0) {
    swapCells(a, b);
    await Promise.all([tween(ta, { x: a.c, y: a.r }, 150, easeInOut), tween(tb, { x: b.c, y: b.r }, 150, easeInOut)]);
    say('Так не выйдет: после обмена нужны три одинаковых подряд.');
    busy = false;
    return;
  }
  await resolveBoard();
  if (!findMove(grid)) await reshuffle(true);
  busy = false;
}

async function newGame() {
  if (busy) return;
  busy = true; selected = null; hint = null;
  score = 0; scoreView.v = 0; bestBase = best;
  grid = makeGrid(Math.random);
  tiles = grid.map((row, r) => row.map((t, c) => ({ type: t, x: c, y: r - ROWS - 1, s: 1, a: 1 })));
  say('Меняй соседние кристаллы местами. Три в ряд исчезают, сверху падают новые.');
  await Promise.all(tiles.flat().map(t => tween(t, { y: Math.round(t.y + ROWS + 1) }, 380 + 45 * (Math.round(t.y + ROWS + 1)))));
  busy = false;
}

// ---------- ввод: касание, свайп ----------
function cellAt(e) {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * size / rect.width - ox;
  const y = (e.clientY - rect.top) * size / rect.height - ox;
  const p = { r: Math.floor(y / cell), c: Math.floor(x / cell) };
  return inBounds(p) ? p : null;
}
canvas.addEventListener('pointerdown', e => {
  if (busy || !grid) return;
  e.preventDefault();
  const p = cellAt(e);
  if (!p) return;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* не критично */ }
  if (selected && adjacent(selected, p)) {
    const a = selected; selected = null; drag = null;
    attemptSwap(a, p);
    return;
  }
  if (selected && selected.r === p.r && selected.c === p.c) {
    selected = null; drag = { x: e.clientX, y: e.clientY, p };
    return;
  }
  selected = p;
  drag = { x: e.clientX, y: e.clientY, p };
});
canvas.addEventListener('pointermove', e => {
  if (!drag || busy) return;
  const rect = canvas.getBoundingClientRect();
  const th = rect.width / COLS * 0.35;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < th) return;
  const p = drag.p;
  const q = Math.abs(dx) > Math.abs(dy)
    ? { r: p.r, c: p.c + (dx > 0 ? 1 : -1) }
    : { r: p.r + (dy > 0 ? 1 : -1), c: p.c };
  drag = null; selected = null;
  attemptSwap(p, q);
});
const endDrag = () => { drag = null; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

$('#btnHint').addEventListener('click', () => {
  if (busy || !grid) return;
  const m = findMove(grid);
  if (m) { hint = { cells: m, until: performance.now() + 2600 }; say('Попробуй поменять местами эти два кристалла.'); }
});
$('#btnShuffle').addEventListener('click', async () => {
  if (busy || !grid) return;
  busy = true; selected = null; hint = null;
  await reshuffle(false);
  busy = false;
});
$('#btnNew').addEventListener('click', () => { newGame(); });

// ---------- запуск ----------
fit();
new ResizeObserver(fit).observe($('#stage'));
window.addEventListener('resize', fit);
requestAnimationFrame(frame);
newGame();

// Для тестов и отладки.
window.__debug = {
  get grid() { return grid; },
  get score() { return score; },
  get busy() { return busy; },
  swap: (a, b) => attemptSwap(a, b),
  setGrid(g) { grid = cloneGrid(g); tiles = buildTiles(grid, 1, 1); selected = null; hint = null; busy = false; },
  findMove: () => findMove(grid),
  cellCenter: (r, c) => { const rect = canvas.getBoundingClientRect(); return { x: rect.left + cx(c) * rect.width / size, y: rect.top + cy(r) * rect.height / size }; },
};
</script>
